services:
  database:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_APP_USER:?Set MYSQL_APP_USER}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?Set MYSQL_APP_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          CMD-SHELL,
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [backend]
    expose: ["3306"]
    ports: ["127.0.0.1:3306:3306"]

  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile.independent
      args:
        VITE_SOURCE_CODE_URL: ${VITE_SOURCE_CODE_URL:?Set public AGPL source URL}
    env_file: .env.production
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    expose: ["3000"]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      database: { condition: service_healthy }
    networks: [backend, edge]

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app: { condition: service_healthy }
    networks: [edge]

  migrate:
    profiles: [tools]
    build:
      context: .
      dockerfile: deploy/Dockerfile.independent
      target: build
    env_file: .env.production
    command: ["corepack", "pnpm", "db:migrate:prod"]
    depends_on:
      database: { condition: service_healthy }
    networks: [backend]

  seed:
    profiles: [tools]
    build:
      context: .
      dockerfile: deploy/Dockerfile.independent
      target: build
    env_file: .env.production
    command: ["corepack", "pnpm", "db:seed:prod"]
    depends_on:
      database: { condition: service_healthy }
    networks: [backend]

volumes:
  mysql_data:
  caddy_data:
  caddy_config:

networks:
  backend:
    internal: true
  edge:
