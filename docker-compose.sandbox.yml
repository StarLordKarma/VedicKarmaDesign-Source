services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: vedic_sandbox
      MYSQL_USER: vedic_sandbox
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
    ports: ["127.0.0.1:3308:3306"]
    volumes: ["mysql_sandbox_data:/var/lib/mysql"]
    healthcheck:
      test:
        [
          CMD,
          mysqladmin,
          ping,
          -h,
          127.0.0.1,
          -u,
          root,
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    ports: ["127.0.0.1:9010:9000", "127.0.0.1:9011:9001"]
    volumes: ["minio_sandbox_data:/data"]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mc alias set health http://127.0.0.1:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" >/dev/null
          && mc ready health
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: [/bin/sh, -c]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing local/vedic-sandbox &&
        mc anonymous set none local/vedic-sandbox
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

  mock-services:
    image: node:22-alpine
    working_dir: /sandbox
    command: [node, sandbox-mock-server.mjs]
    env_file: .env.sandbox
    volumes:
      ["./scripts/sandbox-mock-server.mjs:/sandbox/sandbox-mock-server.mjs:ro"]
    ports: ["127.0.0.1:4010:4010"]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:4010/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    profiles: [tools]
    build:
      context: .
      dockerfile: deploy/Dockerfile.independent
      target: build
      args:
        {
          VITE_SOURCE_CODE_URL: "${VITE_SOURCE_CODE_URL:?Set VITE_SOURCE_CODE_URL}",
        }
    env_file: .env.sandbox
    depends_on:
      mysql: { condition: service_healthy }
    command: [corepack, pnpm, "db:migrate"]

  seed:
    profiles: [tools]
    build:
      context: .
      dockerfile: deploy/Dockerfile.independent
      target: build
      args:
        {
          VITE_SOURCE_CODE_URL: "${VITE_SOURCE_CODE_URL:?Set VITE_SOURCE_CODE_URL}",
        }
    env_file: .env.sandbox
    environment: { SANDBOX_SEED_CONFIRM: "true" }
    depends_on:
      mysql: { condition: service_healthy }
    command: [corepack, pnpm, "db:seed:sandbox"]

  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile.independent
      args:
        {
          VITE_SOURCE_CODE_URL: "${VITE_SOURCE_CODE_URL:?Set VITE_SOURCE_CODE_URL}",
        }
    env_file: .env.sandbox
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      mysql: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      mock-services: { condition: service_healthy }
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  mysql_sandbox_data:
  minio_sandbox_data:
