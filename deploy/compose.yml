services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.independent
      args:
        VITE_SOURCE_CODE_URL: ${VITE_SOURCE_CODE_URL:?Set the public AGPL source URL}
    env_file: .env.standalone
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    expose: ["3000"]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN to the public hostname}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
  migrate:
    profiles: [tools]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.independent
      target: build
    env_file: .env.standalone
    command: [corepack, pnpm, exec, drizzle-kit, migrate]
volumes:
  caddy_data:
  caddy_config:
