name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: cp deploy/.env.staging.example deploy/.env.staging
      - run: docker compose --env-file deploy/.env.staging -f deploy/compose.staging.yml config --quiet
      - run: cp .env.production.example .env.production
      - run: docker compose --env-file .env.production -f docker-compose.prod.yml config --quiet
      - run: docker build -f deploy/Dockerfile.independent -t vedic-karma-design:${{ github.sha }} .

  database-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-ephemeral-only
          MYSQL_DATABASE: vedic_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-ephemeral-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: mysql://root:ci-ephemeral-only@127.0.0.1:3306/vedic_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec drizzle-kit migrate
      - run: pnpm exec vitest run server/notifications.admin.test.ts

  sandbox-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: cp .env.sandbox.example .env.sandbox
      - run: docker compose --env-file .env.sandbox -f docker-compose.sandbox.yml up -d mysql minio minio-init mock-services
      - run: pnpm db:migrate:sandbox
      - run: pnpm sandbox:seed
      - run: docker compose --env-file .env.sandbox -f docker-compose.sandbox.yml up -d --build --wait --wait-timeout 120 app
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: always()
        run: docker compose --env-file .env.sandbox -f docker-compose.sandbox.yml logs --no-color > sandbox-compose.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-e2e-artifacts
          path: |
            sandbox-compose.log
            test-results
            playwright-report
          if-no-files-found: ignore
